<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      The OG card template. Rendered at 1200x630 by scripts/make-og.mjs, which
      injects one card's copy through window.__card before screenshotting.

      Why a template file exists at all: the first on-brand cards (2026-08-24 and
      2026-08-27) were generated ad hoc and the template was never committed, so
      when the site audit found five cards still carrying the pre-rebrand
      terracotta style AND a superseded headline, there was nothing to re-run
      (site audit, 2026-08-29). Now there is.

      Every colour here is read from src/styles/global.css @theme by the script
      and injected as a CSS variable, so a token change cannot silently leave the
      share cards on the old palette. Fonts are the self-hosted files in
      public/assets/fonts, loaded from disk by the script.
    -->
    <style>
      @font-face {
        font-family: "Fixel Display";
        src: url("../public/assets/fonts/fixel-display-extrabold.woff2") format("woff2");
        font-weight: 800;
        font-display: block;
      }
      @font-face {
        font-family: "Fixel Text";
        src: url("../public/assets/fonts/fixel-text-regular.woff2") format("woff2");
        font-weight: 400;
        font-display: block;
      }
      @font-face {
        font-family: "IBM Plex Mono";
        src: url("../public/assets/fonts/ibm-plex-mono-400-latin.woff2") format("woff2");
        font-weight: 400;
        font-display: block;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+2000-206F, U+2192;
      }
      @font-face {
        font-family: "IBM Plex Mono";
        src: url("../public/assets/fonts/ibm-plex-mono-400-cyrillic.woff2") format("woff2");
        font-weight: 400;
        font-display: block;
        unicode-range: U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 1200px;
        height: 630px;
        background: var(--paper);
        color: var(--ink);
        font-family: "Fixel Text", sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 62px 72px 56px;
        position: relative;
        overflow: hidden;
      }

      /* The brand's one green edge. Same role as the pulse dot on the site:
         a line, never an area. */
      body::after {
        content: "";
        position: absolute;
        inset: auto 0 0 0;
        height: 9px;
        background: var(--yes-deep);
      }

      .lockup {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .lockup svg {
        height: 42px;
        width: auto;
        color: var(--ink);
      }

      .eyebrow {
        /* The gap under the lockup is the card's main breathing room: the
           reference card (for-professional-services.png) separates mark from
           message rather than stacking them. */
        margin-top: 52px;
        font-family: "IBM Plex Mono", monospace;
        font-size: 16px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--ink-faint);
      }

      h1 {
        font-family: "Fixel Display", sans-serif;
        font-weight: 800;
        font-size: var(--headline-size, 62px);
        line-height: 1.08;
        letter-spacing: -0.015em;
        margin-top: 18px;
        max-width: 15.5em;
      }
      h1 .accent {
        color: var(--yes-deep);
      }

      p.body {
        margin-top: 24px;
        font-size: 25px;
        line-height: 1.45;
        color: var(--ink-soft);
        max-width: 27em;
      }

      footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-family: "IBM Plex Mono", monospace;
        font-size: 17px;
        color: var(--ink-faint);
      }
      footer .pill {
        border: 1px solid var(--yes-deep);
        color: var(--yes-deep);
        border-radius: 999px;
        padding: 9px 20px;
      }
      footer .pill:empty {
        display: none;
      }
    </style>
  </head>
  <body>
    <div>
      <div class="lockup" id="lockup"></div>
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="headline"></h1>
      <p class="body" id="blurb"></p>
    </div>
    <footer>
      <span id="url"></span>
      <span class="pill" id="pill"></span>
    </footer>
  </body>
</html>
